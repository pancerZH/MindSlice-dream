[project]
name = "mindslice-dream"
version = "0.1.0"
description = "Nightly dream pass that checks a MindSlice memory workspace against git, PyPI and CI and tidies its structure"
requires-python = ">=3.12"
# The CLI runs the dream. Email review uses the same engine's workspace lock and versioned review API.
dependencies = [
    "mindslice>=0.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mindslice-dream = "mindslice_dream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindslice_dream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
